services:
  backend:
    build: ./backend
    container_name: brainmash-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    restart: always
    depends_on:
      - redis   # ✅ backend waits for Redis

  frontend:
    build: ./frontend
    container_name: brainmash-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    restart: always

  redis:
    image: redis:7
    container_name: redis-server
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: always

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"  # Access GUI at http://localhost:5540
    restart: always
    depends_on:
      - redis

volumes:
  redis-data:



